name: medibond_bd
description: "Offline-first medicine reminders and family medication organization for Bangladesh."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.20.3
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  crypto: ^3.0.3
  cryptography: ^2.7.0
  file_picker: ^8.1.3
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1
  image: ^4.2.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/launcher_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#087F79"
  adaptive_icon_foreground: "assets/images/launcher_icon.png"
  adaptive_icon_monochrome: "assets/images/launcher_monochrome.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
